name: LAN Drop security tests

on:
  push:
    paths:
      - "projects/lan-drop/**"
      - ".github/workflows/lan-drop-security-tests.yml"
  pull_request:
    paths:
      - "projects/lan-drop/**"
      - ".github/workflows/lan-drop-security-tests.yml"

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/lan-drop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/lan-drop/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run security regression tests
        run: python -m unittest discover -s tests -v
